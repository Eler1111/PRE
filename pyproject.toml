[project]
name = "pre"
version = "0.1.0"
description = "PRE — Production Reference Environment"
requires-python = ">=3.11"

[project.scripts]
pre = "pre.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pre", "pre.db", "pre.analysis", "pre.importers"]

[tool.setuptools.package-data]
"pre.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
